<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HouseAccount · live pricing-model metrics</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%236366f1'/><g transform='translate(6.5 6.5) scale(1.35)' fill='none' stroke='white' stroke-width='1.5' stroke-linejoin='round' stroke-linecap='round'><path d='M7 1L13 4.5V9.5L7 13L1 9.5V4.5L7 1Z'/><path d='M7 5v4M5 7h4'/></g></svg>">
<style>
  :root {
    --ink:#15172b; --muted:#6b7196; --line:#ebedf5; --line-soft:#f1f2f9;
    --surface:#ffffff; --bg:#f5f6fc; --indigo:#5b5ef0; --violet:#8b5cf6;
    --good:#15a34a; --warn:#dd8500; --bad:#e0483d;
    --shadow:0 1px 2px rgba(22,23,60,.04), 0 10px 30px -14px rgba(22,23,60,.20);
    --radius:16px;
  }
  * { box-sizing:border-box; }
  html { -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
  body { margin:0; color:var(--ink); min-height:100vh;
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(900px 520px at 100% -8%, rgba(139,92,246,.10), transparent 60%),
      radial-gradient(820px 520px at -8% -2%, rgba(91,94,240,.10), transparent 55%),
      var(--bg);
    background-attachment:fixed; }
  .bar { height:4px; background:linear-gradient(90deg,var(--indigo),var(--violet)); }
  .wrap { max-width:960px; margin:0 auto; padding:40px 24px 76px; }

  .hero { margin:0 0 36px; }
  .brand { display:flex; align-items:center; gap:14px; }
  .logo { width:42px; height:42px; border-radius:12px; flex:none; display:grid; place-items:center;
    background:linear-gradient(135deg,var(--indigo),var(--violet)); box-shadow:var(--shadow); }
  .logo svg { width:23px; height:23px; }
  h1 { font-size:25px; line-height:1.15; margin:0; letter-spacing:-.02em; font-weight:700; }
  .tag { margin:3px 0 0; color:var(--muted); font-size:13px; }
  .live { margin-left:auto; display:inline-flex; align-items:center; gap:7px; background:#fff;
    border:1px solid var(--line); border-radius:999px; padding:6px 13px; font-size:12px;
    font-weight:600; color:var(--good); box-shadow:var(--shadow); }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--good); animation:pulse 2s infinite; }
  @keyframes pulse {
    0% { box-shadow:0 0 0 0 rgba(21,163,74,.45); }
    70% { box-shadow:0 0 0 7px rgba(21,163,74,0); }
    100% { box-shadow:0 0 0 0 rgba(21,163,74,0); } }
  .sub { color:var(--muted); font-size:13px; margin:20px 0 0; font-variant-numeric:tabular-nums; }

  section { margin:0 0 32px; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted);
    font-weight:700; margin:0 0 14px; display:flex; align-items:center; gap:9px; }
  h2::before { content:""; width:15px; height:2px; border-radius:2px;
    background:linear-gradient(90deg,var(--indigo),var(--violet)); }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(178px,1fr)); gap:14px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px; box-shadow:var(--shadow); transition:transform .18s ease, box-shadow .18s ease; }
  .card:hover { transform:translateY(-2px);
    box-shadow:0 1px 2px rgba(22,23,60,.05), 0 18px 42px -16px rgba(22,23,60,.30); }
  .card .v { font-size:27px; font-weight:700; letter-spacing:-.02em; line-height:1.1;
    font-variant-numeric:tabular-nums; }
  .card .k { font-size:12.5px; color:var(--ink); font-weight:600; margin-top:7px; }
  .card .d { font-size:11.5px; color:var(--muted); margin-top:7px; line-height:1.45; }
  .v.good { color:var(--good); } .v.warn { color:var(--warn); }

  table { width:100%; border-collapse:separate; border-spacing:0; background:var(--surface);
    border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); }
  th,td { padding:12px 16px; text-align:right; font-variant-numeric:tabular-nums; font-size:13.5px; }
  th:first-child,td:first-child { text-align:left; }
  thead th { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);
    font-weight:700; background:#fafbff; border-bottom:1px solid var(--line); }
  tbody tr + tr td { border-top:1px solid var(--line-soft); }
  tbody tr:hover td { background:#fafbff; }
  .pill { display:inline-block; padding:3px 11px; border-radius:999px; font-size:12px; font-weight:600; }
  .pill.ok { background:#e6f6ec; color:var(--good); }
  .pill.bad { background:#fdeceb; color:var(--bad); }
  .hint { border-bottom:1px dotted var(--muted); cursor:help; }
  .cap { color:var(--muted); font-size:12.5px; margin:10px 2px 0; line-height:1.5; }

  .foot { color:var(--muted); font-size:12.5px; margin-top:38px; padding-top:18px;
    border-top:1px solid var(--line); line-height:1.8; }
  .foot a { color:var(--indigo); text-decoration:none; font-weight:500; }
  .foot a:hover { text-decoration:underline; }
  code { background:#eef0f8; border-radius:5px; padding:1.5px 6px; font-size:12px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
</style>
</head>
<body>
<div class="bar"></div>
<div class="wrap">
  <header class="hero">
    <div class="brand">
      <span class="logo"><svg viewBox="0 0 14 14" fill="none" stroke="#fff" stroke-width="1.4"
        stroke-linejoin="round" stroke-linecap="round"><path d="M7 1L13 4.5V9.5L7 13L1 9.5V4.5L7 1Z"/>
        <path d="M7 5v4M5 7h4"/></svg></span>
      <div>
        <h1>HouseAccount Pricing Model</h1>
        <p class="tag">Live production metrics</p>
      </div>
      <span class="live"><span class="dot"></span>Live</span>
    </div>
    <p class="sub" id="sub">Loading from the production API…</p>
  </header>
  <div id="root"></div>
  <p class="foot"><a href="about.html">How it works — technical brief →</a> ·
    live from <a href="https://pricing-ml-production.up.railway.app/metrics">the production API</a> ·
    auto-refreshes every 15s · raw JSON at <code>/metrics</code>, Prometheus scrape at <code>/metrics/prometheus</code></p>
</div>
<script>
const API = "https://pricing-ml-production.up.railway.app";
const pct = v => v == null ? "—" : v + "%";
const cls = (v, warn) => v == null ? "" : v <= warn ? "good" : "warn";
const card = (v, k, d, c="") => `<div class="card"><div class="v ${c}">${v}</div>
  <div class="k">${k}</div>${d ? `<div class="d">${d}</div>` : ""}</div>`;

async function load() {
  let m;
  try { m = await (await fetch(API + "/metrics")).json(); }
  catch (e) { document.getElementById("sub").textContent = "Could not reach the production API."; return; }
  document.getElementById("sub").textContent =
    `${m.model_version} · ${m.n_train} training outcomes · updated ${new Date().toLocaleTimeString()}`;
  const r = m.rolling_90d || {}, cb = m.circuit_breaker || {}, tb = m.training_benchmarks || {};
  const html = [];

  html.push(`<section><h2>Live accuracy · last 90 days</h2><div class="grid">
    ${card(pct(r.mape), "MAPE", "Average error vs final price. Lower is better.", cls(r.mape, 20))}
    ${card(pct(r.wape), "WAPE", "Error weighted by job size — big jobs count more.", cls(r.wape, 20))}
    ${card("$" + (r.rmse ?? "—"), "RMSE", "Typical dollar miss per estimate.")}
    ${card(r.n ?? 0, "Outcomes scored", "Completed jobs with a known final price.")}
  </div></section>`);

  html.push(`<section><h2>Model health</h2><div class="grid">
    ${card(`<span class="pill ${cb.open ? "bad" : "ok"}">${cb.open ? "OPEN" : "Closed"}</span>`,
      "Circuit breaker", `${cb.failures || 0} recent failures. Open = falling back to baseline.`)}
    ${card(`<span class="pill ${m.retrain_running ? "bad" : "ok"}">${m.retrain_running ? "Running" : "Idle"}</span>`,
      "Retraining", `Triggers after ${m.retrain_threshold} new outcomes.`)}
    ${card(m.total_estimates, "Estimates served", "Total price requests handled.")}
    ${card(m.total_outcomes, "Outcomes recorded", "Jobs reported back with a final price.")}
  </div></section>`);

  const rows = (m.per_category_90d || []).map(c => `<tr>
    <td>${c.category}</td><td class="${cls(c.mape, 20)}" style="color:inherit">${pct(c.mape)}</td>
    <td>${pct(c.wape)}</td><td>$${c.rmse ?? "—"}</td><td>${c.n}</td></tr>`).join("");
  if (rows) html.push(`<section><h2>Accuracy by category · 90 days</h2>
    <table><thead><tr><th>Category</th><th>MAPE</th><th>WAPE</th><th>RMSE</th><th>Jobs</th></tr></thead>
    <tbody>${rows}</tbody></table></section>`);

  if (tb.mape_baseline != null) html.push(`<section><h2>Training benchmark · model vs baseline</h2>
    <table><thead><tr><th>Metric</th><th>Baseline</th><th>Model</th></tr></thead><tbody>
    <tr><td><span class="hint" title="Mean Absolute Percentage Error — on average, how far off the estimate is from the real price. Every job counts equally. Lower is better.">MAPE</span></td><td>${pct(tb.mape_baseline)}</td><td class="${cls(tb.mape_routed, tb.mape_baseline)}" style="color:inherit">${pct(tb.mape_routed)}</td></tr>
    <tr><td><span class="hint" title="Weighted Absolute Percentage Error — like MAPE, but bigger jobs count more. The % of total dollars we misjudged. Lower is better.">WAPE</span></td><td>${pct(tb.wape_baseline)}</td><td>${pct(tb.wape_routed)}</td></tr>
    <tr><td><span class="hint" title="Root Mean Squared Error — a typical miss in actual dollars (penalizes large misses extra). Lower is better.">RMSE</span></td><td>$${tb.rmse_baseline}</td><td>$${tb.rmse_routed}</td></tr>
    <tr><td><span class="hint" title="Accuracy on Handyman jobs — the baseline's weakest category and the one this model was built to fix.">Handyman MAPE</span></td><td>${pct(tb.handyman_mape_baseline)}</td><td class="good" style="color:inherit">${pct(tb.handyman_mape_model)}</td></tr>
    </tbody></table>
    <p class="cap">Baseline is HouseAccount's current pricing model; Model is this one — measured on historical jobs with a known final price. Lower is better on every row. The model matches the baseline on easy categories and fixes the hard ones: Handyman accuracy improves ~12 points while overall accuracy holds.</p></section>`);

  document.getElementById("root").innerHTML = html.join("");
}
load(); setInterval(load, 15000);
</script>
</body>
</html>
